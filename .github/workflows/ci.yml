name: Local library and integration checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_runtime_dependency.py
      - run: pytest
      - run: python -m build library

  native-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - run: python -m pip install homeassistant==2026.10.4 pytest-homeassistant-custom-component==0.13.375 pseg-nj-mymeter==0.2.0
      - run: python -m pytest tests/ha -q
